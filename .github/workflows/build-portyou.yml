
name: PortYou Studio Android Builder

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.build-source"
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*portyou*studio*.zip' -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found project archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/.build-source"
            SEARCH_ROOT="$GITHUB_WORKSPACE/.build-source"
          else
            echo "No PortYou ZIP found; checking repository source files."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi
          BUILD_FILE=$(find "$SEARCH_ROOT" -type f -path '*/android/build.gradle' -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: PortYou project not found. Upload the project ZIP or its extracted files."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located at: $PROJECT_DIR"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3" "cmake;3.10.2.4988404" "ndk;20.0.5594570"

      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '4.6'

      - name: Fetch native and audio dependencies
        run: |
          cd "$PROJECT_DIR"
          sh scripts/fetch-native-deps.sh
          sh scripts/fetch-codecs.sh

      - name: Sync Android assets
        run: |
          cd "$PROJECT_DIR"
          sh scripts/sync-android-assets.sh

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR/android" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
