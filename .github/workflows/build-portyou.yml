
name: PortYou Studio Android Builder

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.build-source"
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*portyou*studio*.zip' -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/.build-source"
            SEARCH_ROOT="$GITHUB_WORKSPACE/.build-source"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi
          BUILD_FILE=$(find "$SEARCH_ROOT" -type f -path '*/android/build.gradle' -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo 'ERROR: Android project not found'
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-28" "build-tools;28.0.3" "cmake;3.10.2.4988404" "ndk;20.0.5594570"
          yes | sdkmanager --licenses

      - name: Switch to Java 8 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 4.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '4.6'

      - name: Fetch native and audio dependencies
        run: |
          cd "$PROJECT_DIR"
          sh scripts/fetch-native-deps.sh
          sh scripts/fetch-codecs.sh

      - name: Sync Android assets
        run: |
          cd "$PROJECT_DIR"
          sh scripts/sync-android-assets.sh

      - name: Build APK
        run: gradle -p "$PROJECT_DIR/android" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
